# Catppuccin Mocha lock screen — matches the Waybar palette and typography.
general {
    hide_cursor = true
}

background {
    monitor =
    path = /home/gustavo/.config/hypr/wallpapers/hyprlock-catppuccin-aurora.png
    color = rgb(1e1e2e)

    # Soften the artwork slightly and retain a quiet area for the controls.
    blur_passes = 2
    blur_size = 4
    noise = 0.010
    contrast = 0.92
    brightness = 0.68
    vibrancy = 0.12
    vibrancy_darkness = 0.12
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date '+%H:%M')"
    color = rgb(cdd6f4)
    font_size = 92
    font_family = JetBrainsMono Nerd Font

    position = 0, 105
    halign = center
    valign = center

    shadow_passes = 3
    shadow_size = 4
    shadow_color = rgba(11111bcc)
}

label {
    monitor =
    text = cmd[update:60000] echo "$(date '+%A, %d de %B')"
    color = rgb(a6adc8)
    font_size = 16
    font_family = JetBrainsMono Nerd Font

    position = 0, 35
    halign = center
    valign = center

    shadow_passes = 2
    shadow_size = 3
    shadow_color = rgba(11111bcc)
}

input-field {
    monitor =
    size = 360, 62
    outline_thickness = 2
    rounding = 14

    outer_color = rgba(89b4faff) rgba(cba6f7ff) 45deg
    inner_color = rgba(1e1e2ee6)
    font_color = rgb(cdd6f4)
    font_family = JetBrainsMono Nerd Font
    placeholder_text = <i>Digite sua senha...</i>
    fade_on_empty = false

    dots_size = 0.25
    dots_spacing = 0.28
    dots_center = true

    check_color = rgb(a6e3a1)
    check_text = <i>Verificando...</i>
    fail_color = rgb(f38ba8)
    fail_text = <i>Senha incorreta <b>($ATTEMPTS)</b></i>
    capslock_color = rgb(f9e2af)

    position = 0, -55
    halign = center
    valign = center
}

label {
    monitor =
    text = Pressione Enter para desbloquear
    color = rgb(6c7086)
    font_size = 13
    font_family = JetBrainsMono Nerd Font

    position = 0, -115
    halign = center
    valign = center
}
